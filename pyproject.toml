[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gp-roulette-islands"
version = "0.1.0"
description = "Mock-first LLM mutation GP with roulette selection and four islands"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["llm_gp*"]
