evolution:
  # Fully-deterministic variant of ros_gazebo_lattice_fork_minmax_30gen_fixed_goal.yaml:
  # same fixed start/goal (see that file's comment for why the goal was
  # fixed), but selection.parent_method/survivor_method are also switched
  # from the roulette-based (probabilistic) methods to deterministic ones
  # (llm_gp/selection.py's rank_select_parent_pair / truncation_select_
  # survivors): parent pairs are formed by ranking the population by
  # fitness and pairing adjacent ranks (rank 1&2 -> pair 1, rank 3&4 ->
  # pair 2, ...), and survivors are simply the top population_size by
  # fitness. No rng is consulted for either step, so the only remaining
  # sources of run-to-run variation are the LLM's own sampling and Gazebo's
  # physics/timing noise -- not this repo's own selection code.
  smoke_mode: true
  max_generations: 30
  population_size_per_island: 10
  parent_pairs_per_island: 2
  elite_count: 1

islands:
  # Islands intentionally disabled (single population) for this experiment
  # so fitness normalization has one unambiguous generation-wide min/max
  # instead of needing a per-island-vs-global-scope decision.
  count: 1
  names: [main]

selection:
  parent_method: rank_pairing
  survivor_method: truncation
  epsilon: 1.0e-9
  avoid_same_parent_pair: true

migration:
  # Unused with a single island (ring migration is a same-island no-op),
  # kept at the values config validation requires.
  interval: 10
  migrants_per_island: 1
  migrant_selection: best
  topology: ring
  reevaluate_migrants: false

fitness:
  # Fitness is normalized against each generation's own observed min/max
  # (see llm_gp/fitness.py's GenerationMetricStats) rather than against
  # fixed reference constants, so planning_reference/path_reference/
  # arrival_reference/expansion_reference below are no longer used to score
  # individuals -- they are kept only because FitnessSettings/operators.py's
  # LLM-prompt metric-ratio text still read them, and because config loading
  # requires the keys to be present.
  planning_weight: 0.33
  path_weight: 0.34
  arrival_weight: 0.33
  planning_reference: 1.0
  path_reference: 41.0
  arrival_reference: 200.0
  failure_fitness: 0.0
  expansion_reference: 45000.0

validation:
  max_repair_attempts: 1
  build_timeout_seconds: 180
  forbid_dwa_changes: true

evaluation:
  evaluator_type: ros_gazebo
  repetitions_per_goal: 3
  timeout_seconds: 200
  # No goal_x_range/goal_y_range here -- every one of the repetitions_per_goal
  # repetitions targets exactly this single point every time, for every
  # individual across all generations.
  fixed_goal: [16.5, 2.0, 0.0]
  ros_gazebo:
    wsl_distribution: Ubuntu-20.04
    workspace: /home/adachi/catkin_ws_2024_12_2/catkin_ws
    launch_file: src/dwa_local_planner/launch/astar_dwa_lattice_fork.launch
    package_name: global_planner
    candidate_target: src/global_planner/src/rastar.cpp
    robot_model: burger
    gazebo_model_name: turtlebot3_burger
    start_pose: [-11.8, 2.0, -0.00143]
    startup_timeout_seconds: 60
    plan_topic: /move_base/GlobalPlanner/plan
    node_expansions_topic: /move_base/GlobalPlanner/node_expansions

llm:
  provider: openai
  model: gpt-5.6-luna
  fallback_to_mock: true

database:
  path: experiment_results/lattice_fork_minmax_30gen_deterministic/roulette_ros_lattice_fork_minmax_30gen_deterministic.db

output:
  source_directory: experiment_results/lattice_fork_minmax_30gen_deterministic/individual_sources
  generation_csv: experiment_results/lattice_fork_minmax_30gen_deterministic/generation_summary.csv

random_seed: 42
