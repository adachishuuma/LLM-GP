evolution:
  # Parallel-workspace smoke test only: confirms 4 concurrent Gazebo
  # evaluations (one per island) run cleanly against additional_workspaces
  # without port/PID collisions, before trusting a real multi-hour run.
  # Do not use these sizes/results for anything but that check.
  smoke_mode: true
  max_generations: 1
  population_size_per_island: 1
  parent_pairs_per_island: 1
  elite_count: 1

islands:
  count: 4
  names: [island_1, island_2, island_3, island_4]

selection:
  parent_method: roulette
  survivor_method: roulette_without_replacement
  epsilon: 1.0e-9
  avoid_same_parent_pair: true

migration:
  interval: 10
  migrants_per_island: 1
  migrant_selection: best
  topology: ring
  reevaluate_migrants: false

fitness:
  planning_weight: 0.33
  path_weight: 0.34
  arrival_weight: 0.33
  planning_reference: 1.0
  path_reference: 30.0
  arrival_reference: 60.0
  failure_fitness: 0.0
  expansion_reference: 2000.0

validation:
  max_repair_attempts: 1
  build_timeout_seconds: 180
  forbid_dwa_changes: true

evaluation:
  evaluator_type: ros_gazebo
  repetitions_per_goal: 1
  timeout_seconds: 120
  fixed_goal: [1.69, 0.954, -0.00143]
  ros_gazebo:
    wsl_distribution: Ubuntu-20.04
    workspace: /home/adachi/catkin_ws_2024_12_2/catkin_ws
    launch_file: src/dwa_local_planner/launch/astar_dwa.launch
    package_name: global_planner
    candidate_target: src/global_planner/src/rastar.cpp
    robot_model: burger
    gazebo_model_name: turtlebot3_burger
    start_pose: [-2.0, -0.5, 0.0]
    startup_timeout_seconds: 60
    plan_topic: /move_base/GlobalPlanner/plan
    node_expansions_topic: /move_base/GlobalPlanner/node_expansions
    # Same 3 clones the 10-generation run will use -- create them once with:
    #   bash scripts/setup_parallel_workspaces.sh /home/adachi/catkin_ws_2024_12_2/catkin_ws 3
    additional_workspaces:
      - /home/adachi/catkin_ws_2024_12_2/catkin_ws_worker1
      - /home/adachi/catkin_ws_2024_12_2/catkin_ws_worker2
      - /home/adachi/catkin_ws_2024_12_2/catkin_ws_worker3

llm:
  provider: openai
  model: gpt-4o-mini
  fallback_to_mock: true

database:
  path: experiment_results/parallel_smoke/roulette_ros_parallel_smoke.db

output:
  source_directory: experiment_results/parallel_smoke/individual_sources
  generation_csv: experiment_results/parallel_smoke/generation_summary.csv

random_seed: 42
