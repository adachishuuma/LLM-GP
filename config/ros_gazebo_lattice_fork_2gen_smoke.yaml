evolution:
  # Quick 2-generation smoke test of the redesigned LLM operators (feedback-
  # driven mutation, meaningful-change gate, LLM-based crossover). Purpose is
  # NOT statistical rigor -- it's just to eyeball
  # analysis/generation_NNN_best_*.diff and confirm the new operators are
  # actually touching the search algorithm (heuristic/tie-break/cost/pruning)
  # instead of comments or a push_back->emplace_back-style no-op. Same map as
  # ros_gazebo_lattice_fork_10gen.yaml, but repetitions_per_goal is cut to 1
  # (smoke_mode allows it) purely for turnaround speed.
  smoke_mode: true
  max_generations: 2
  population_size_per_island: 2
  parent_pairs_per_island: 1
  elite_count: 1

islands:
  count: 4
  names: [island_1, island_2, island_3, island_4]

selection:
  parent_method: roulette
  survivor_method: roulette_without_replacement
  epsilon: 1.0e-9
  avoid_same_parent_pair: true

migration:
  # interval is fixed at 10 by config validation; never triggers in 2 generations.
  interval: 10
  migrants_per_island: 1
  migrant_selection: best
  topology: ring
  reevaluate_migrants: false

fitness:
  # Same calibration as ros_gazebo_lattice_fork_10gen.yaml (see that file's
  # comment for the derivation from real run_20260811_065434 data).
  planning_weight: 0.33
  path_weight: 0.34
  arrival_weight: 0.33
  planning_reference: 1.0
  path_reference: 41.0
  arrival_reference: 200.0
  failure_fitness: 0.0
  expansion_reference: 45000.0

validation:
  max_repair_attempts: 1
  build_timeout_seconds: 180
  forbid_dwa_changes: true
  # New meaningful-change gate: defaults (require_meaningful_change=true,
  # min_change_ratio=0.005, jitter_fallback_on_trivial_change=true) apply
  # since they're omitted here -- this run exists specifically to check they
  # work as intended.

evaluation:
  evaluator_type: ros_gazebo
  repetitions_per_goal: 1
  timeout_seconds: 200
  fixed_goal: [16.5, 2.0, 0.0]
  goal_x_range: [15.0, 16.5]
  goal_y_range: [1.5, 2.3]
  ros_gazebo:
    wsl_distribution: Ubuntu-20.04
    workspace: /home/adachi/catkin_ws_2024_12_2/catkin_ws
    launch_file: src/dwa_local_planner/launch/astar_dwa_lattice_fork.launch
    package_name: global_planner
    candidate_target: src/global_planner/src/rastar.cpp
    robot_model: burger
    gazebo_model_name: turtlebot3_burger
    start_pose: [-11.8, 2.0, -0.00143]
    startup_timeout_seconds: 60
    plan_topic: /move_base/GlobalPlanner/plan
    node_expansions_topic: /move_base/GlobalPlanner/node_expansions

llm:
  provider: openai
  model: gpt-4o-mini
  fallback_to_mock: true

database:
  path: experiment_results/lattice_fork_2gen_smoke/roulette_ros_lattice_fork_2gen_smoke.db

output:
  source_directory: experiment_results/lattice_fork_2gen_smoke/individual_sources
  generation_csv: experiment_results/lattice_fork_2gen_smoke/generation_summary.csv

random_seed: 42
