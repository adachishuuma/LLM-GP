evolution:
  # Pilot run on the harder myroom_plus_x4_v3 map (4x floor area, ~2x the
  # walls/corridors of myroom_plus). Mirrors ros_gazebo_10gen_small.yaml's
  # sizing on purpose: validate that candidates actually reach the far goal
  # here before scaling this up to a full 50-generation / 10-per-island run
  # (copy ros_gazebo.yaml's evolution/islands/database sizing once this
  # pilot's success rate and node_expansions spread look reasonable).
  smoke_mode: true
  max_generations: 10
  population_size_per_island: 2
  parent_pairs_per_island: 1
  elite_count: 1

islands:
  count: 4
  names: [island_1, island_2, island_3, island_4]

selection:
  parent_method: roulette
  survivor_method: roulette_without_replacement
  epsilon: 1.0e-9
  avoid_same_parent_pair: true

migration:
  interval: 10
  migrants_per_island: 1
  migrant_selection: best
  topology: ring
  reevaluate_migrants: false

fitness:
  planning_weight: 0.33
  path_weight: 0.34
  arrival_weight: 0.33
  planning_reference: 1.0
  path_reference: 30.0
  arrival_reference: 60.0
  failure_fitness: 0.0
  # TODO calibrate: this map is ~4x the area of myroom_plus, so its baseline
  # node_expansions will be well above the 2000.0 used for the small-map
  # configs. Run scripts/repeat10_compare.py once against the baseline
  # (ind_000001) on this map and set this to roughly its mean node_expansions.
  expansion_reference: 6000.0

validation:
  max_repair_attempts: 1
  build_timeout_seconds: 180
  forbid_dwa_changes: true

evaluation:
  evaluator_type: ros_gazebo
  repetitions_per_goal: 3
  # Longer timeout than the small-map configs: the goal is ~28m away in a
  # straight line vs. ~12m on myroom_plus, and DWA has more corridor turns
  # to negotiate.
  timeout_seconds: 300
  fixed_goal: [23.875, 1.475, 0.0]
  ros_gazebo:
    wsl_distribution: Ubuntu-20.04
    workspace: /home/adachi/catkin_ws_2024_12_2/catkin_ws
    launch_file: src/dwa_local_planner/launch/astar_dwa_complex_map.launch
    package_name: global_planner
    candidate_target: src/global_planner/src/rastar.cpp
    robot_model: burger
    gazebo_model_name: turtlebot3_burger
    start_pose: [-0.325, 14.125, 0.0]
    startup_timeout_seconds: 60
    plan_topic: /move_base/GlobalPlanner/plan
    node_expansions_topic: /move_base/GlobalPlanner/node_expansions

llm:
  provider: openai
  model: gpt-4o-mini
  fallback_to_mock: true

database:
  path: experiment_results/complex_map/roulette_ros_complex_map.db

output:
  source_directory: experiment_results/complex_map/individual_sources
  generation_csv: experiment_results/complex_map/generation_summary.csv

random_seed: 42
