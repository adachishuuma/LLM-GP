evolution:
  # Pilot run on myroom_plus_branching (myroom_plus + a shortcut breach +
  # a new 3-way branch/merge extension). Sized like ros_gazebo_10gen_small.yaml
  # for a first pass.
  smoke_mode: true
  max_generations: 10
  population_size_per_island: 2
  parent_pairs_per_island: 1
  elite_count: 1

islands:
  count: 4
  names: [island_1, island_2, island_3, island_4]

selection:
  parent_method: roulette
  survivor_method: roulette_without_replacement
  epsilon: 1.0e-9
  avoid_same_parent_pair: true

migration:
  interval: 10
  migrants_per_island: 1
  migrant_selection: best
  topology: ring
  reevaluate_migrants: false

fitness:
  planning_weight: 0.33
  path_weight: 0.34
  arrival_weight: 0.33
  planning_reference: 1.0
  path_reference: 30.0
  arrival_reference: 60.0
  failure_fitness: 0.0
  # TODO calibrate: run scripts/repeat10_compare.py once against the
  # baseline (ind_000001) on this map and set this to roughly its mean
  # node_expansions.
  expansion_reference: 3000.0

validation:
  max_repair_attempts: 1
  build_timeout_seconds: 180
  forbid_dwa_changes: true

evaluation:
  evaluator_type: ros_gazebo
  repetitions_per_goal: 3
  # Longer than myroom_plus's own configs: the new goal is much further
  # away (through the original winding room, then the bridge/branch).
  timeout_seconds: 240
  fixed_goal: [19.6, 1.05, 0.0]
  ros_gazebo:
    wsl_distribution: Ubuntu-20.04
    workspace: /home/adachi/catkin_ws_2024_12_2/catkin_ws
    launch_file: src/dwa_local_planner/launch/astar_dwa_myroom_branching.launch
    package_name: global_planner
    candidate_target: src/global_planner/src/rastar.cpp
    robot_model: burger
    gazebo_model_name: turtlebot3_burger
    start_pose: [0.0, 6.85, 0.0]
    startup_timeout_seconds: 60
    plan_topic: /move_base/GlobalPlanner/plan
    node_expansions_topic: /move_base/GlobalPlanner/node_expansions

llm:
  provider: openai
  model: gpt-4o-mini
  fallback_to_mock: true

database:
  path: experiment_results/myroom_branching/roulette_ros_myroom_branching.db

output:
  source_directory: experiment_results/myroom_branching/individual_sources
  generation_csv: experiment_results/myroom_branching/generation_summary.csv

random_seed: 42
